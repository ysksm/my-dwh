<div class="dashboard">
  <div *ngIf="loading">読み込み中...</div>

  <div *ngIf="!loading">
    <h2>ダッシュボード</h2>
    <div class="stats-grid">
      <div class="stat-card">
        <h3>総レコード数</h3>
        <p class="stat-value">{{ stats?.total_records || 0 }}</p>
      </div>
      <div class="stat-card">
        <h3>ユニーク値</h3>
        <p class="stat-value">{{ stats?.unique_values || 0 }}</p>
      </div>
      <div class="stat-card">
        <h3>平均値</h3>
        <p class="stat-value">{{ stats?.avg_value?.toFixed(2) || 0 }}</p>
      </div>
    </div>
    <div class="info-section">
      <h3>機能概要</h3>
      <ul>
        <li>✅ 基本的なテーブルの表示</li>
        <li>✅ テーブルの結合 (JOIN クエリ対応)</li>
        <li>✅ 複数のデータベース参照</li>
        <li>✅ Parquet ファイル読み込み</li>
        <li>✅ DuckDB による高速クエリ</li>
      </ul>
    </div>
  </div>
</div>
