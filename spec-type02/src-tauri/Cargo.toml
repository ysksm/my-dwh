[package]
name = "spec-type02"
version = "0.1.0"
description = "Data Analysis App Prototype with Angular and Tauri"
authors = ["ysksm"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
duckdb = { version = "0.10", features = ["bundled"] }
arrow = "51.0"
parquet = "51.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
